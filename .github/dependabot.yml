# Electron embarque Chromium : chaque version apporte des correctifs de sécurité. Dependabot ouvre une pull request par version ;
# ci.yml la fusionne seul quand les tests passent (hors nouvelle version majeure), puis release.yml publie.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
